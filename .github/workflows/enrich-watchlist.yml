name: Enrich watchlist from SEC EDGAR

on:
  workflow_dispatch:
  push:
    paths:
      - "watchlist.json"
      - "scripts/enrich-watchlist.mjs"
      - ".github/workflows/enrich-watchlist.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run enrich:sec
      - name: Commit enriched watchlist
        run: |
          if git diff --quiet; then
            echo "No SEC data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          git commit -m "Enrich watchlist from SEC EDGAR"
          git push
